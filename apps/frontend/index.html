<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Sistem Informasi Akademik SIMAK Vokasi Politeknik Sorowako" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SIMAK Vokasi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" />
    <title>SIMAK Vokasi</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('simak_theme') || localStorage.getItem('theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      .app-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        font-family: 'Work Sans', system-ui, sans-serif;
        color: #0f172a;
        transition: background-color 0.2s;
      }
      .dark .app-splash {
        background-color: #020617;
        color: #f8fafc;
      }
      .app-splash-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(2, 132, 199, 0.15);
        border-top-color: #0284c7;
        border-radius: 50%;
        animation: appSplashSpin 0.8s linear infinite;
      }
      @keyframes appSplashSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="app-splash">
        <div class="app-splash-spinner"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 500; opacity: 0.75;">Memuat SIMAK Vokasi...</p>
      </div>
    </div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>

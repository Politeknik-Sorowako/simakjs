services:
  db:
    image: postgres:15-alpine
    container_name: simak_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simak_password}
      POSTGRES_DB: ${POSTGRES_DB:-simak_vokasi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: simak_backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://simak_user:simak_password@db:5432/simak_vokasi}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-simak_vokasi_secret_key_123456}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APP_MODE=${VITE_APP_MODE:-development}
    container_name: simak_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:


services:
  db:
    image: postgres:15-alpine
    container_name: simak_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simak_password}
      POSTGRES_DB: ${POSTGRES_DB:-simak_vokasi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    restart: unless-stopped
    container_name: simak_backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://simak_user:simak_password@db:5432/simak_vokasi}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://simak.politekniksorowako.ac.id,http://simak.politekniksorowako.ac.id,http://localhost:8080,http://localhost:3000}
      NODE_ENV: development
      DOMAIN_NAME: localhost
      PGHOST: db
      PGPORT: "5432"
      BACKUP_DIR: ./backups
      BACKUP_RETENTION: "10"
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
      - backup_data:/app/apps/backend/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    init: true
    container_name: simak_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://simak.politekniksorowako.ac.id:3000}
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backup_data:


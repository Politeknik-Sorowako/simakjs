services:
  db:
    image: postgres:15-alpine
    container_name: simak_db
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simak_password}
      POSTGRES_DB: ${POSTGRES_DB:-simak_vokasi}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    memswap_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    restart: unless-stopped
    container_name: simak_backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://simak_user:simak_password@db:5432/simak_vokasi}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://simak.politekniksorowako.ac.id,http://simak.politekniksorowako.ac.id,http://localhost:8080,http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      PGHOST: db
      PGPORT: "5432"
      BACKUP_DIR: ./backups
      BACKUP_RETENTION: "10"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-politekniksorowako.ac.id}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      SIGN_HMAC_KEYS: ${SIGN_HMAC_KEYS}
      SIGN_ACTIVE_KID: ${SIGN_ACTIVE_KID:-k1}
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-https://verify.politekniksorowako.ac.id}
      # Kunci enkripsi parameter rahasia di system_settings (mis. FEEDER_PASSWORD).
      # Wajib diteruskan ke container: kode hanya membaca process.env. Kosongkan
      # hanya pada server yang belum ingin mengaktifkan enkripsi (fail-open plaintext).
      SETTINGS_SECRET_KEY: ${SETTINGS_SECRET_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - backup_data:/app/apps/backend/backups
      - app_logs:/app/apps/backend/logs
    mem_limit: 384m
    memswap_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APP_MODE=${VITE_APP_MODE:-production}
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
    init: true
    restart: unless-stopped
    container_name: simak_frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    mem_limit: 64m
    memswap_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

volumes:
  pgdata:
  backup_data:
  app_logs:



services:
  db:
    image: postgres:15-alpine
    container_name: simak_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simak_password}
      POSTGRES_DB: ${POSTGRES_DB:-simak_vokasi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: simak_backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://simak_user:simak_password@db:5432/simak_vokasi}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080,http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-development}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - PGHOST=${PGHOST:-db}
      - PGPORT=${PGPORT:-5432}
      - BACKUP_DIR=${BACKUP_DIR:-./backups}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-10}
    volumes:
      - backup_data:/app/apps/backend/backups
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APP_MODE=${VITE_APP_MODE:-development}
    container_name: simak_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backup_data:


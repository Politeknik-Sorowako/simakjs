services:
  db_staging:
    image: postgres:15-alpine
    container_name: simak_db_staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simak_user_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simak_password_staging}
      POSTGRES_DB: ${POSTGRES_DB:-simak_vokasi_staging}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      default:
        aliases:
          - db_staging
          - db

  backend_staging:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    container_name: simak_backend_staging
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-simak_user_staging}:${POSTGRES_PASSWORD:-simak_password_staging}@db_staging:5432/${POSTGRES_DB:-simak_vokasi_staging}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "http://localhost:8082,http://localhost:3001,https://staging-simak.politekniksorowako.ac.id"
      NODE_ENV: development
      DOMAIN_NAME: staging-simak.politekniksorowako.ac.id
      PGHOST: db_staging
      PGPORT: "5432"
      BACKUP_DIR: ./backups
      BACKUP_RETENTION: "10"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-politekniksorowako.ac.id}
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      - backup_data_staging:/app/apps/backend/backups
      - app_logs_staging:/app/apps/backend/logs
      - upload_data_staging:/app/apps/backend/uploads
    networks:
      default:
        aliases:
          - backend
    depends_on:
      db_staging:
        condition: service_healthy

  frontend_staging:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APP_MODE=${VITE_APP_MODE:-development}
    init: true
    container_name: simak_frontend_staging
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend_staging

volumes:
  pgdata_staging:
  backup_data_staging:
  app_logs_staging:
  upload_data_staging:

networks:
  default:
    name: simak_staging_network


name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |

            cd /var/www/simakjs
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/Politeknik-Sorowako/simakjs.git
            env -u GITHUB_TOKEN git pull origin main

            # Source configuration
            source .deployment/health-check.config.sh

            docker compose down
            docker compose up --build -d

            sleep "$STARTUP_WAIT_SECONDS"

            echo "=== Backend Log ==="
            docker compose logs "$BACKEND_CONTAINER" --tail="$BACKEND_LOG_LINES"

            echo "=== Health Check ==="
            for i in $(seq 1 "$HEALTH_CHECK_RETRIES"); do
              echo "Attempt $i/$HEALTH_CHECK_RETRIES..."
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --connect-timeout "$HEALTH_CHECK_TIMEOUT") && STATUS_CODE=$? || STATUS_CODE=$?
              if [ "$RESPONSE" = "200" ]; then
                echo "✓ Health check passed (HTTP $RESPONSE)"
                curl -s "$HEALTH_URL" | head -c 200
                echo ""
                exit 0
              fi
              echo "  Response: HTTP $RESPONSE"
              [ $i -lt "$HEALTH_CHECK_RETRIES" ] && sleep "$HEALTH_CHECK_INTERVAL"
            done

            if [ "$FAIL_ON_HEALTH_CHECK" = "true" ]; then
              echo "✗ Health check failed after $HEALTH_CHECK_RETRIES attempts"
              echo "=== Backend Full Log ==="
              docker compose logs "$BACKEND_CONTAINER" --tail=50
              exit 1
            else
              echo "⚠ Health check failed but continuing (FAIL_ON_HEALTH_CHECK=false)"
              exit 0
            fi

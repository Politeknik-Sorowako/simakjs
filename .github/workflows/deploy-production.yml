name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://simak.politekniksorowako.ac.id
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/simakjs

            # Configure git for auto-deploy
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/Politeknik-Sorowako/simakjs.git
            env -u GITHUB_TOKEN git pull origin main

            # Set deployment variables
            export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN || '' }}"
            export TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID || '' }}"
            export TELEGRAM_ENABLED="${{ secrets.TELEGRAM_ENABLED || 'false' }}"

            # Run main deploy script for production
            chmod +x deploy.sh
            ./deploy.sh main
